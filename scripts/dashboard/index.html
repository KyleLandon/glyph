<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glyph — Local ops</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div class="grain"></div>
    </div>

    <header class="top">
      <div class="brand">
        <img src="/logo.png" width="44" height="44" alt="" />
        <div>
          <h1>GLYPH</h1>
          <p>Local ops · localhost only</p>
        </div>
      </div>
      <div class="top-actions">
        <span id="clock" class="clock"></span>
        <button type="button" class="btn btn-ghost" id="btn-start">
          Start stack
        </button>
      </div>
    </header>

    <main>
      <section class="cards" id="cards"></section>

      <section class="console">
        <div class="console-head">
          <nav class="tabs" id="log-tabs"></nav>
          <label class="follow">
            <input type="checkbox" id="follow" checked />
            Follow
          </label>
        </div>
        <pre id="log" class="log" aria-live="polite"></pre>
        <form id="rcon-form" class="rcon">
          <select id="rcon-target" aria-label="RCON target">
            <option value="anarchy">Anarchy</option>
            <option value="smp">Forever World</option>
          </select>
          <input
            id="rcon-cmd"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="RCON — list, say, restart…"
          />
          <button type="submit" class="btn btn-gold">Send</button>
        </form>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
