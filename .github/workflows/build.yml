name: build

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Docker is available on ubuntu-latest, so Testcontainers-based
      # integration tests (PostgreSQL, Redis) run here.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            glyph-core/build/libs/*.jar
            glyph-proxy/build/libs/*.jar
