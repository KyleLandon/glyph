<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forever World map — Glyph</title>
    <meta
      name="description"
      content="Live 3D map of Glyph Forever World. Hang out, build, stay."
    />
    <meta property="og:title" content="Forever World map — Glyph" />
    <meta
      property="og:description"
      content="Live BlueMap of smp.glyphmc.net."
    />
    <link rel="icon" href="/assets/glyph-logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=4" />
  </head>
  <body class="map-page">
    <header class="map-bar">
      <a class="map-brand" href="/">
        <img src="/assets/glyph-logo.png" width="36" height="36" alt="" />
        Glyph
      </a>
      <span class="map-title">Forever World</span>
      <a
        class="map-open"
        href="https://map.glyphmc.net"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open map only
      </a>
    </header>
    <iframe
      class="map-frame"
      title="Forever World live map"
      src="https://map.glyphmc.net"
      allow="fullscreen"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
    <noscript>
      <p class="map-fallback">
        JavaScript is not required. Open
        <a href="https://map.glyphmc.net">map.glyphmc.net</a>
        if this page is blank.
      </p>
    </noscript>
  </body>
</html>
