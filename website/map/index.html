<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glyph — Forever World map</title>
    <meta name="description" content="Live 3D map of Glyph Forever World." />
    <link rel="icon" href="../assets/glyph-logo.png" type="image/png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050508;
        overflow: hidden;
      }

      .map-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #050508;
      }

      .map-chrome {
        position: fixed;
        top: 0.75rem;
        right: 0.75rem;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        justify-content: flex-end;
        max-width: calc(100% - 1.5rem);
        pointer-events: none;
      }

      .map-chrome a {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.45rem 0.75rem;
        border-radius: 0.35rem;
        background: rgba(5, 5, 8, 0.82);
        border: 1px solid rgba(34, 211, 238, 0.35);
        color: #e8edf7;
        font-family: "Segoe UI", sans-serif;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-decoration: none;
      }

      .map-chrome a:hover {
        border-color: #22d3ee;
        color: #22d3ee;
      }

      .map-chrome img {
        width: 1.15rem;
        height: 1.15rem;
      }
    </style>
  </head>
  <body>
    <iframe
      class="map-frame"
      src="https://map.glyphmc.net/"
      title="Forever World live map"
      allow="fullscreen"
      allowfullscreen
    ></iframe>
    <nav class="map-chrome" aria-label="Glyph">
      <a href="/">
        <img src="../assets/glyph-logo.png" width="20" height="20" alt="" />
        Glyph
      </a>
      <a href="https://map.glyphmc.net/" target="_blank" rel="noopener noreferrer">
        Open map only
      </a>
    </nav>
  </body>
</html>
