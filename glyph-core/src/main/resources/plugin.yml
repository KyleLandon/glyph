name: GlyphCore
version: "${version}"
main: com.glyph.core.GlyphCorePlugin
api-version: "26.1.2"
folia-supported: true
description: Core platform plugin for the Glyph anarchy-economy network.
authors: [Glyph]
# VaultUnlocked registers under the plugin name "Vault"; load after it so the
# economy bridge can register (GlyphCore works fine without it).
softdepend: [Vault]

# Downloaded by the server from Maven Central at startup; keep versions in
# sync with gradle/libs.versions.toml (they are injected at build time).
libraries:
  - com.zaxxer:HikariCP:${hikaricpVersion}
  - org.flywaydb:flyway-core:${flywayVersion}
  - org.flywaydb:flyway-database-postgresql:${flywayVersion}
  - org.postgresql:postgresql:${postgresqlVersion}
  - io.lettuce:lettuce-core:${lettuceVersion}

commands:
  glyph:
    description: Glyph platform administration.
    usage: /glyph <status|version>
    permission: glyph.admin
  balance:
    description: Show your balance.
    usage: /balance [player]
    aliases: [bal]
    permission: glyph.economy
  pay:
    description: Pay another player.
    usage: /pay <player> <amount>
    permission: glyph.economy
  baltop:
    description: Show the largest balances.
    usage: /baltop
    permission: glyph.economy
  money:
    description: Money utilities.
    usage: /money history
    permission: glyph.economy
  eco:
    description: Administrative balance control.
    usage: /eco <get|set|add|remove> <player> [amount]
    permission: glyph.economy.admin
  ah:
    description: The auction house.
    usage: /ah [sell <price> | search <text>]
    aliases: [auction, auctionhouse]
    permission: glyph.auction
  claim:
    description: Claim pending item deliveries.
    usage: /claim
    aliases: [mail]
    permission: glyph.auction
  bounty:
    description: View or place bounties.
    usage: /bounty [<player> | add <player> <amount>]
    permission: glyph.bounty
  stats:
    description: Show player statistics.
    usage: /stats [player]
    permission: glyph.stats
  playtime:
    description: Show your playtime.
    usage: /playtime
    permission: glyph.stats
  top:
    description: Show leaderboards.
    usage: /top <money|kills|deaths|playtime|bounty>
    permission: glyph.stats
  glyphs:
    description: Prestige currency balance and shop.
    usage: /glyphs [shop | buy <id> | color <id|none> | unlocks]
    permission: glyph.glyphs
  glyphadmin:
    description: Administrative Glyph balance control.
    usage: /glyphadmin <get|set|add|remove|unlinkdiscord> <player> [amount]
    permission: glyph.glyphs.admin
  linkdiscord:
    description: Link your Minecraft account to Discord.
    usage: /linkdiscord
    permission: glyph.discord
  unlinkdiscord:
    description: Unlink Discord from your Minecraft account.
    usage: /unlinkdiscord
    permission: glyph.discord
  item:
    description: Show your held item in chat (hover + click to copy).
    usage: /item
    aliases: [showitem, whatamiholding]
    permission: glyph.chat.item
  rules:
    description: Read the Glyph rules book.
    usage: /rules
    permission: glyph.rules
  starter:
    description: Claim the first-join starter pack (stone tools and rules book).
    usage: /starter [player]
    permission: glyph.starter

permissions:
  glyph.admin:
    description: Access to Glyph platform administration commands.
    default: op
  glyph.economy:
    description: Access to player economy commands (/balance, /pay, /baltop, /money).
    default: true
  glyph.economy.admin:
    description: Access to /eco and other players' balances.
    default: op
  glyph.auction:
    description: Access to the auction house and deliveries (/ah, /claim).
    default: true
  glyph.bounty:
    description: Access to bounties (/bounty).
    default: true
  glyph.stats:
    description: Access to statistics (/stats, /playtime, /top).
    default: true
  glyph.glyphs:
    description: Access to Glyphs prestige currency (/glyphs).
    default: true
  glyph.glyphs.admin:
    description: Access to /glyphadmin.
    default: op
  glyph.discord:
    description: Access to Discord account linking (/linkdiscord, /unlinkdiscord).
    default: true
  glyph.chat.item:
    description: Share held items in chat (/item and [i] placeholders).
    default: true
  glyph.rules:
    description: Access to /rules.
    default: true
  glyph.starter:
    description: Claim the starter pack with /starter.
    default: true
  glyph.starter.admin:
    description: Give the starter pack to another online player (/starter <player>).
    default: op
