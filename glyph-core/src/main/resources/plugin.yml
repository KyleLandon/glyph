name: GlyphCore
version: "${version}"
main: com.glyph.core.GlyphCorePlugin
api-version: "26.1.2"
folia-supported: true
description: Core platform plugin for the Glyph anarchy-economy network.
authors: [Glyph]
# VaultUnlocked registers under the plugin name "Vault"; load after it so the
# economy bridge can register (GlyphCore works fine without it).
softdepend: [Vault, GriefPrevention, CoreProtect, BlueMap]

# Downloaded by the server from Maven Central at startup; keep versions in
# sync with gradle/libs.versions.toml (they are injected at build time).
libraries:
  - com.zaxxer:HikariCP:${hikaricpVersion}
  - org.flywaydb:flyway-core:${flywayVersion}
  - org.flywaydb:flyway-database-postgresql:${flywayVersion}
  - org.postgresql:postgresql:${postgresqlVersion}
  - io.lettuce:lettuce-core:${lettuceVersion}

commands:
  glyph:
    description: Glyph platform administration.
    usage: /glyph <status|version|restart|setspawn|market>
    permission: glyph.admin
  restart:
    description: Restart this backend after a 10-second countdown.
    usage: /restart
    aliases: [reboot]
    permission: glyph.admin
  balance:
    description: Show your balance.
    usage: /balance [player]
    aliases: [bal]
    permission: glyph.economy
  pay:
    description: Pay another player.
    usage: /pay <player> <amount>
    permission: glyph.economy
  baltop:
    description: Show the largest balances.
    usage: /baltop
    permission: glyph.economy
  money:
    description: Money utilities.
    usage: /money history
    permission: glyph.economy
  eco:
    description: Administrative balance control.
    usage: /eco <get|set|add|remove> <player> [amount]
    permission: glyph.economy.admin
  ah:
    description: The auction house.
    usage: /ah [sell <price> | search <text> | mail]
    aliases: [auction, auctionhouse]
    permission: glyph.auction
  bounty:
    description: Wanted board, posters, and bounty placement.
    usage: /bounty [list | poster [player] | <player> | add <player> <amount>]
    aliases: [wanted]
    permission: glyph.bounty
  stats:
    description: Show player statistics.
    usage: /stats [player]
    permission: glyph.stats
  playtime:
    description: Show your playtime.
    usage: /playtime
    permission: glyph.stats
  top:
    description: Show leaderboards.
    usage: /top <money|kills|deaths|playtime|bounty>
    permission: glyph.stats
  glyphs:
    description: Prestige currency balance and shop.
    usage: /glyphs [shop | buy <id> | color <id|none> | unlocks]
    permission: glyph.glyphs
  glyphadmin:
    description: Administrative Glyph balance control.
    usage: /glyphadmin <get|set|add|remove|unlinkdiscord> <player> [amount]
    permission: glyph.glyphs.admin
  linkdiscord:
    description: Link your Minecraft account to Discord.
    usage: /linkdiscord
    permission: glyph.discord
  unlinkdiscord:
    description: Unlink Discord from your Minecraft account.
    usage: /unlinkdiscord
    permission: glyph.discord
  item:
    description: Show your held item in chat (hover + click to copy).
    usage: /item
    aliases: [showitem, whatamiholding]
    permission: glyph.chat.item
  g:
    description: Shout to everyone on this world.
    usage: /g <message>
    aliases: [global, shout]
    permission: glyph.chat.global
  l:
    description: Speak to players nearby.
    usage: /l <message>
    aliases: [local]
    permission: glyph.chat.local
  rules:
    description: Read the Glyph rules book.
    usage: /rules
    permission: glyph.rules
  starter:
    description: Claim the first-join starter pack (stone tools and rules book).
    usage: /starter [player]
    permission: glyph.starter
  home:
    description: Teleport to a Forever World home.
    usage: /home [name]
    permission: glyph.home
  sethome:
    description: Set a Forever World home at your location.
    usage: /sethome [name]
    permission: glyph.home
  delhome:
    description: Delete a Forever World home.
    usage: /delhome [name]
    permission: glyph.home
  homes:
    description: List your Forever World homes.
    usage: /homes
    permission: glyph.home
  nickname:
    description: Set your Forever World character name.
    usage: /nickname [name|off]
    aliases: [nick]
    permission: glyph.nickname
  me:
    description: Nearby roleplay emote.
    usage: /me <action>
    permission: glyph.me
  spawn:
    description: Teleport to Forever World spawn.
    usage: /spawn
    permission: glyph.spawn
  wild:
    description: Random unclaimed overworld teleport.
    usage: /wild
    aliases: [rtp]
    permission: glyph.wild
  tpa:
    description: Request to teleport to a player.
    usage: /tpa <player>
    permission: glyph.tpa
  tpahere:
    description: Request a player to teleport to you.
    usage: /tpahere <player>
    permission: glyph.tpa
  tpaccept:
    description: Accept a teleport request.
    usage: /tpaccept
    aliases: [tpyes]
    permission: glyph.tpa
  tpdeny:
    description: Deny a teleport request.
    usage: /tpdeny
    aliases: [tpno]
    permission: glyph.tpa
  sit:
    description: Sit down. Sneak to stand.
    usage: /sit
    permission: glyph.sit
  claimblocks:
    description: View or buy extra claim blocks.
    usage: /claimblocks [buy [packs]]
    aliases: [blocks, buyclaimblocks]
    permission: glyph.claimblocks
  warp:
    description: Forever World player warps.
    usage: /warp [name | set <name> | delete <name> | list]
    permission: glyph.warp
  warps:
    description: List Forever World player warps.
    usage: /warps
    permission: glyph.warp
  shop:
    description: Chest shops on claimed land.
    usage: /shop sell <price> | buy <price> | remove
    permission: glyph.shop
  trade:
    description: Secure two-player trade.
    usage: /trade <player>
    permission: glyph.trade
  mapimage:
    description: Paint a map from an HTTPS image URL.
    usage: /mapimage <https-url>
    aliases: [imagemap]
    permission: glyph.mapimage

permissions:
  glyph.admin:
    description: Access to Glyph platform administration commands.
    default: op
  glyph.economy:
    description: Access to player economy commands (/balance, /pay, /baltop, /money).
    default: true
  glyph.economy.admin:
    description: Access to /eco and other players' balances.
    default: op
  glyph.auction:
    description: Access to the auction house and deliveries (/ah, /ah mail).
    default: true
  glyph.bounty:
    description: Access to bounties (/bounty).
    default: true
  glyph.stats:
    description: Access to statistics (/stats, /playtime, /top).
    default: true
  glyph.glyphs:
    description: Access to Glyphs prestige currency (/glyphs).
    default: true
  glyph.glyphs.admin:
    description: Access to /glyphadmin.
    default: op
  glyph.discord:
    description: Access to Discord account linking (/linkdiscord, /unlinkdiscord).
    default: true
  glyph.chat.item:
    description: Share held items in chat (/item and [i] placeholders).
    default: true
  glyph.chat.global:
    description: Access to /g global chat.
    default: true
  glyph.chat.local:
    description: Access to /l local chat.
    default: true
  glyph.rules:
    description: Access to /rules.
    default: true
  glyph.starter:
    description: Claim the starter pack with /starter.
    default: true
  glyph.starter.admin:
    description: Give the starter pack to another online player (/starter <player>).
    default: op
  glyph.home:
    description: Access to Forever World homes (/home, /sethome, /delhome, /homes).
    default: true
  glyph.nickname:
    description: Access to /nickname on the Forever World.
    default: true
  glyph.me:
    description: Access to /me emotes on the Forever World.
    default: true
  glyph.spawn:
    description: Access to /spawn on the Forever World.
    default: true
  glyph.wild:
    description: Access to /wild on the Forever World.
    default: true
  glyph.tpa:
    description: Access to /tpa, /tpahere, /tpaccept, /tpdeny.
    default: true
  glyph.sit:
    description: Access to /sit on the Forever World.
    default: true
  glyph.claimblocks:
    description: Access to /claimblocks.
    default: true
  glyph.warp:
    description: Access to /warp and /warps.
    default: true
  glyph.shop:
    description: Access to /shop chest shops.
    default: true
  glyph.trade:
    description: Access to /trade.
    default: true
  glyph.mapimage:
    description: Access to /mapimage.
    default: true
