# GlyphCore main configuration.
# Every value can be overridden with environment variables (see comments).

server:
  # Unique identifier of this backend server. Override: GLYPH_SERVER_ID
  id: glyph-01

economy:
  # All amounts are WHOLE DOLLARS — the economy has no cents.
  # Balance granted when a player's account is created. $100 gives new
  # players instant market liquidity — enough for the minimum bounty or a
  # cheap auction buy. One-time per player, so alt accounts are not worth
  # farming.
  starting-balance: 100
  # Prefix used when formatting amounts.
  currency-symbol: "$"
  # Cash HUD on the action bar (above the hotbar). Sidebar was abandoned
  # because client minimaps (Xaero, etc.) cover the right-side scoreboard.
  hud:
    enabled: true
    title: "GLYPH"

auction:
  enabled: true
  # Charged when a listing is created, percent of the asking price. Burned
  # as a money sink (GDD section 17).
  listing-fee-percent: 1.0
  # Deducted from the seller's proceeds when a listing sells. Also burned.
  sale-fee-percent: 5.0
  # Concurrent ACTIVE listings per player.
  max-listings-per-player: 10
  # Listing lifetime; expired items return via /claim.
  duration-hours: 48

bounties:
  enabled: true
  # Smallest bounty, in whole dollars. GDD section 63.
  minimum: 100
  # Killing the same player again within this window still records the kill
  # but withholds the bounty payout (anti-farming, GDD section 25).
  same-victim-cooldown-minutes: 60

rewards:
  # Active-playtime earnings: the launch money faucet (GDD section 16).
  # Minted as SYSTEM_REWARD ledger entries, so supply growth is measurable.
  playtime:
    enabled: true
    # Payout window length.
    interval-minutes: 15
    # Payment per active window, in whole dollars ($10 -> ~$40/hour of
    # genuinely active play).
    amount: 10
    # Activity required in the window before it pays: 1 unit = one block
    # broken/placed or one meter moved. AFK players earn nothing.
    min-activity: 20
